name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked validation dependencies
        run: pip install -r requirements-validation.lock
      - name: Validate aggregate and publication provenance
        run: |
          PYTHONPATH=src python tools/validate-benchmark.py
          python tools/validate_publication.py --require-git
      - name: Validate portfolio project
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build pinned CPU image
        run: docker build -t yolo-training-pipeline:ci .
      - name: Lint and test pure contracts
        run: |
          docker run --rm --entrypoint ruff yolo-training-pipeline:ci check src tests
          docker run --rm --entrypoint pytest yolo-training-pipeline:ci -q
      - name: Run complete CPU training proof offline
        run: docker run --rm --network none yolo-training-pipeline:ci
