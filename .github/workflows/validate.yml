name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Validate portfolio contract
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker

      - name: Build pinned CPU image
        run: docker build --tag yolo-training-pipeline:${{ github.sha }} .

      - name: Lint
        run: docker run --rm --entrypoint ruff yolo-training-pipeline:${{ github.sha }} check src tests

      - name: Test pure contracts
        run: >-
          docker run --rm --entrypoint pytest yolo-training-pipeline:${{ github.sha }}
          tests/test_domain.py tests/test_dataset.py tests/test_artifact.py tests/test_config.py
          --cov=yolo_training_pipeline.domain
          --cov=yolo_training_pipeline.dataset
          --cov=yolo_training_pipeline.artifact
          --cov=yolo_training_pipeline.config
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Run complete CPU training proof
        run: >-
          docker run --rm
          --volume "$PWD/benchmarks/results:/results"
          --env BENCHMARK_OUTPUT=/results/ci.json
          yolo-training-pipeline:${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: yolo-training-pipeline-benchmark
          path: benchmarks/results/ci.json
