schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: yolo-training-pipeline (#1)
  Program: applied-computer-vision
  Component pack: applied-computer-vision
  Source of truth:
    - Use `.portfolio/` as the local snapshot of portfolio-reuse-kit.
    - Use `project.yaml` for the public project contract.
    - Use `openspec/changes/ship-yolo-training-pipeline/` for approved scope.
    - Use `sdd/` for lightweight handoff and release evidence.
  Core rules:
    - Prove held-out mAP50-95 and warmed latency from one CPU Docker path.
    - Treat synthetic data as pipeline evidence, not domain performance.
    - Keep Ultralytics outside pure annotation, metric, and aggregation policy.
    - Use AGPL-3.0-only while the project imports open-source Ultralytics.
    - Download no weights or datasets in the default runtime.
    - Resolve reuse findings as patch-now, backlog, or reject.
rules:
  reference-reuse:
    - Local skills and `.portfolio/` remain primary; external sources are attributed organizational or technical references.
  intent:
    - Keep the claim measurable, offline at runtime, and README-ready.
  portfolio-impact:
    - Produce the checkpoint/evidence contract consumed by later vision projects.
  architecture-record:
    - Answer the OpenSpec self-challenge and define evidence-based revisit triggers.
  component-pack:
    - Use `applied-computer-vision` and `python-computer-vision`.
  reuse-delta:
    - Patch general vision rules into the kit; keep project generator and trainer code local.
  benchmark-proof:
    - Retain three successful runs, every failure, environment, image ID, dataset hash, checkpoint bytes, held-out metrics, warmup, batch, image size, and latency samples.
  verification:
    - Verify Docker, pure tests, full train/validate/reload/predict path, JSON, README number, license, references, reuse review, and CI.
